<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AgentForge — Enterprise Architect Architecture</title>
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #f8f9fc; display: flex; justify-content: center; }
  svg { max-width: 860px; width: 100%; height: auto; }
  .node { cursor: pointer; }
  .node:hover { opacity: 0.88; }

  .th { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
  .ts { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 400; }

  .c-gray  > rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray  > text.th { fill: #2C2C2A; } .c-gray  > text.ts { fill: #5F5E5A; }

  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple > text.th { fill: #26215C; } .c-purple > text.ts { fill: #534AB7; }

  .c-teal  > rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal  > text.th { fill: #04342C; } .c-teal  > text.ts { fill: #0F6E56; }

  .c-amber > rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .c-amber > text.th { fill: #412402; } .c-amber > text.ts { fill: #854F0B; }

  .c-coral > rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral > text.th { fill: #4A1B0C; } .c-coral > text.ts { fill: #993C1D; }

  .c-red   > rect { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 0.5; }
  .c-red   > text.th { fill: #501313; } .c-red   > text.ts { fill: #A32D2D; }

  .c-green > rect { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
  .c-green > text.th { fill: #173404; } .c-green > text.ts { fill: #3B6D11; }

  .c-blue  > rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue  > text.th { fill: #042C53; } .c-blue  > text.ts { fill: #185FA5; }

  /* tier band fills */
  .band-definition  { fill: #EEEDFE; }
  .band-runtime     { fill: #E1F5EE; }
  .band-integration { fill: #FAEEDA; }
  .band-infra       { fill: #F1EFE8; }

  .band-label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #2C2C2A; }

  .arr  { stroke: #888780; stroke-width: 1.5; fill: none; }
  .runtime-border { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 5 3; }
  .legend-dot  { }
  .legend-text { font-family: system-ui, sans-serif; font-size: 11px; fill: #5F5E5A; }
  .muted { font-family: system-ui, sans-serif; font-size: 11px; fill: #888780; }
</style>
</head>
